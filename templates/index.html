<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ chatbot_name }}</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;font-family:Inter,system-ui;background:radial-gradient(circle at 15% 10%,#17345b,transparent 35%),radial-gradient(circle at 85% 90%,#25205d,transparent 35%),#07101d;color:#f7fbff}.app{height:100vh;max-width:1050px;margin:auto;display:flex;flex-direction:column}.head{padding:20px 25px;border-bottom:1px solid #ffffff18;background:#07101dcc;backdrop-filter:blur(18px)}.brand{display:flex;gap:13px;align-items:center}.logo{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#6366f1,#22d3ee);font-size:22px}.head h1{margin:0;font-size:18px}.head p{margin:4px 0 0;color:#8fa4bb;font-size:12px}.messages{flex:1;overflow:auto;padding:25px 16px}.welcome{max-width:650px;text-align:center;margin:12vh auto}.welcome div{font-size:55px}.welcome h2{font-size:42px;margin:5px}.welcome p{color:#8fa4bb;line-height:1.7}.msg{max-width:800px;margin:12px auto;display:flex}.msg.user{justify-content:flex-end}.bubble{max-width:78%;padding:13px 16px;border-radius:17px;white-space:pre-wrap;line-height:1.6;font-size:14px}.user .bubble{background:linear-gradient(135deg,#6366f1,#22d3ee);border-bottom-right-radius:5px}.model .bubble{background:#0c192bdc;border:1px solid #ffffff14;border-bottom-left-radius:5px}.composer{padding:15px 18px 19px;border-top:1px solid #ffffff14;background:#07101dcc}.composer form{max-width:800px;margin:auto;display:flex;gap:8px;padding:7px;border:1px solid #ffffff18;border-radius:17px;background:#ffffff08}.composer textarea{flex:1;resize:none;min-height:45px;max-height:140px;background:transparent;color:white;border:0;outline:0;padding:11px;font:inherit}.composer button{width:48px;height:48px;border:0;border-radius:13px;background:linear-gradient(135deg,#6366f1,#22d3ee);color:white;font-size:18px}.composer button:disabled{opacity:.5}.note{text-align:center;color:#60758d;font-size:10px;margin-top:8px}@media(max-width:600px){.bubble{max-width:90%}.welcome h2{font-size:32px}}
</style></head><body>
<div class="app"><header class="head"><div class="brand"><div class="logo">📚</div><div><h1>{{ chatbot_name }}</h1><p>Focused study assistant</p></div></div></header>
<main id="messages" class="messages"><div id="welcome" class="welcome"><div>📖</div><h2>Let's learn.</h2><p>Ask a study question related to this subject.</p></div></main>
<div class="composer"><form id="form"><textarea id="input" rows="1" placeholder="Ask your study question..."></textarea><button id="send">➤</button></form><div class="note">Powered by Gemini</div></div></div>
<script>
const f=document.getElementById("form"),i=document.getElementById("input"),s=document.getElementById("send"),m=document.getElementById("messages");let h=[];
function add(r,t){let w=document.getElementById("welcome");if(w)w.remove();let x=document.createElement("div");x.className="msg "+r;let b=document.createElement("div");b.className="bubble";b.textContent=t;x.appendChild(b);m.appendChild(x);m.scrollTop=m.scrollHeight}
f.onsubmit=async e=>{e.preventDefault();let t=i.value.trim();if(!t||s.disabled)return;let old=h.slice();add("user",t);h.push({role:"user",text:t});i.value="";s.disabled=true;try{let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:t,history:old})});let d=await r.json();if(!r.ok)throw Error();add("model",d.reply||d.error);h.push({role:"model",text:d.reply||d.error})}catch(e){add("model","Sorry, I couldn't process that request right now.")}finally{s.disabled=false;i.focus()}};
i.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();f.requestSubmit()}};i.oninput=()=>{i.style.height="auto";i.style.height=Math.min(i.scrollHeight,140)+"px"};
</script></body></html>
